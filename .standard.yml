# Match the four gemspecs, which all declare `>= 3.2`.
#
# This said 3.1 for a while, on the reasoning that a Struct without
# `keyword_init: true` binds the whole keyword hash to its first member -- true
# on 3.1, and the reason the floor was held there. The gemspecs have since moved
# to 3.2, where Struct takes keyword arguments natively, so the linter follows.
#
# The rule that matters is unchanged: target the oldest Ruby the gems admit to,
# never the newest one CI happens to run.
ruby_version: 3.2

ignore:
  # Bundler installs into gems/*/vendor/bundle here. A pattern anchored at the
  # repository root would not match those, and standardrb would spend its time
  # linting other people's gemspecs.
  - "**/vendor/**/*"
  - "**/tmp/**/*"
  - "template/**/*"
