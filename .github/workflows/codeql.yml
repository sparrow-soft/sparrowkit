name: CodeQL

# Static analysis for Ruby, run by GitHub. Free for public repositories.
#
# This complements Brakeman rather than repeating it: Brakeman models a Rails
# application's app/ directory, so it sees two controllers here and none of the
# lib/ code where most of SparrowKit actually lives. CodeQL reads all of it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query pattern finds old code too.
    - cron: "22 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ruby
    runs-on: ubuntu-latest

    # Code scanning needs a public repository, or Advanced Security on a
    # private one. Without this guard the job fails on every push to a private
    # repo with "code scanning is not enabled" -- and a build that is always
    # red is a build nobody reads.
    if: github.event.repository.visibility == 'public'

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ruby
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:ruby"
